<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ASCII Lilien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one full-bleed canvas; a quiet centered gate (dedication + date) that dissolves into the bouquet; one dim hint line at the bottom. */
:root {
  --bg: #060606;
  --fg: #ece5dc;
  --dim: #6e6762;
  --line: #1f1c1b;
  --pink: #e8789a;
  --mono: Menlo, Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#intro {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 1.1s ease, filter 1.1s ease;
  text-align: center;
}
#intro.gone { opacity: 0; filter: blur(6px); pointer-events: none; }
.to {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(38px, 7vw, 64px);
  line-height: 1;
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.to b { font-weight: 400; color: var(--pink); }
#gate { margin: 0; }
#d {
  width: 15ch;
  font: 500 16px/1 var(--mono);
  letter-spacing: 0.22em;
  padding: 8px 0 8px 0.22em;
  text-align: center;
  color: var(--fg);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  outline: none;
  caret-color: var(--pink);
  transition: border-color .4s;
  -webkit-user-select: text;
  user-select: text;
}
#d::placeholder { color: var(--dim); opacity: .55; }
#d:focus { border-bottom-color: #34302d; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#hint {
  position: fixed; left: 0; right: 0; bottom: 0; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px;
  font: 500 11px/1.4 var(--mono);
  letter-spacing: 0.08em;
  color: var(--dim);
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
}
#hint.on { opacity: .85; pointer-events: auto; }
#hint.rest { opacity: .28; }
#hint.rest:hover { opacity: .85; }
#regrow {
  font: inherit; letter-spacing: inherit; color: inherit;
  background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #3a3533;
}
#regrow:hover { color: var(--fg); }
#regrow:focus-visible { outline: 1px dashed var(--dim); outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) {
  #intro { transition: opacity .3s; }
}
</style>
</head>
<body>

<canvas id="c" aria-label="Ein Strauß Lilien aus ASCII-Zeichen"></canvas>

<main id="intro">
  <p class="to" id="to">für kalea</p>
  <form id="gate" autocomplete="off">
    <label class="sr" for="d">Datum</label>
    <input id="d" name="d" type="text" inputmode="decimal" placeholder="tt.mm.jjjj" maxlength="12" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
  </form>
</main>

<p id="hint" aria-live="polite">
  <span id="hintText">maus bewegen = brise · klick = windstoß</span>
  <span>·</span>
  <button id="regrow" type="button">neu pflanzen</button>
</p>

<script>
(() => {
  'use strict';

  // ---------- setup ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const MONO = 'Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const BG = '#060606';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;

  // personal line: #Name in the link (or ?fuer=Name when self-hosted)
  (() => {
    let name = '';
    try {
      const qs = new URLSearchParams(location.search);
      const h = decodeURIComponent(location.hash.slice(1));
      name = (qs.get('fuer') || qs.get('for') || h || '').trim();
    } catch (_) {}
    if (name && /^[\p{L}0-9 .'-]{1,28}$/u.test(name)) {
      const el = document.getElementById('to');
      el.textContent = 'für ';
      const b = document.createElement('b');
      b.textContent = name;
      el.appendChild(b);
    }
  })();
  if (coarse) document.getElementById('hintText').textContent = 'wischen = brise · tippen = windstoß';

  // ---------- glyphs & depth layers ----------
  // brightness ramp in kalea's alphabet; every layer is its own offset character grid
  const RAMP = '.:lkeaLKAE';
  const SCR = 'kaleaKALEA';
  const CHARS = RAMP + SCR;
  const RL = RAMP.length;
  const LAYERS = [
    { ox: 0.5, oy: 0.5, br: 0.74, sc: 0.94, shadow: 0 },     // back
    { ox: 0.0, oy: 0.0, br: 1.0, sc: 1.0, shadow: 0.45 },    // middle
    { ox: 0.5, oy: 0.25, br: 1.12, sc: 1.08, shadow: 0.58 }, // front
  ];
  const Z1 = -16, Z2 = 30;
  for (const L of LAYERS) {
    L.c = document.createElement('canvas');
    L.x = L.c.getContext('2d', { willReadFrequently: true });
  }
  const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
  const mask = document.createElement('canvas'), mctx = mask.getContext('2d');
  const tint = document.createElement('canvas'), tctx = tint.getContext('2d');
  const sil = document.createElement('canvas'), sctx = sil.getContext('2d');
  let tintImg = null;

  let W, H, dpr, fs, cellW, cellH, cols, rows, S, OX, OY, gw, gh;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min((H * 0.93) / 880, (W * 0.95) / 760);
    fs = Math.max(5, Math.min(12, Math.round((880 * S) / 112)));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = `bold ${fs}px ${MONO}`;
    cellW = ctx.measureText('M').width || fs * 0.6;
    cellH = fs;
    cols = Math.ceil(W / cellW) + 1; rows = Math.ceil(H / cellH) + 1;
    for (const L of LAYERS) { L.c.width = cols; L.c.height = rows; }
    tint.width = cols; tint.height = rows;
    sil.width = cols; sil.height = rows;
    tintImg = tctx.createImageData(cols, rows);
    mask.width = cv.width; mask.height = cv.height;
    OX = W / 2;
    OY = Math.min(H - Math.max(6, H * 0.012), (H + 870 * S) / 2);
    gw = Math.ceil(cellW * dpr); gh = Math.ceil(cellH * dpr);
    atlas.width = gw * CHARS.length; atlas.height = gh;
    actx.clearRect(0, 0, atlas.width, atlas.height);
    actx.font = `bold ${fs * dpr}px ${MONO}`;
    actx.textBaseline = 'top';
    actx.fillStyle = '#fff';
    for (let i = 0; i < CHARS.length; i++) actx.fillText(CHARS[i], i * gw, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- helpers ----------
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const smooth = (a, b, t) => { t = clamp((t - a) / (b - a)); return t * t * (3 - 2 * t); };
  const mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  function mulberry(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(x, y, z) {
    let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const colCache = new Map();
  function rgb(r, g, b) {
    r = r < 0 ? 0 : r > 255 ? 255 : r | 0;
    g = g < 0 ? 0 : g > 255 ? 255 : g | 0;
    b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
    const key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2);
    let s = colCache.get(key);
    if (!s) { s = `rgb(${r & 252},${g & 252},${b & 252})`; colCache.set(key, s); }
    return s;
  }
  const rgbc = (c, k) => rgb(c[0] * k, c[1] * k, c[2] * k);

  // light from upper left, slightly in front
  const LX = -0.4, LY = -0.58, LZ = 0.71;

  // palette
  const C = {
    stemYoung: [150, 206, 66], stemOld: [92, 154, 52],
    leafYoung: [164, 212, 70],
    leaves: [[60, 120, 40], [76, 138, 46], [92, 154, 52], [110, 168, 58], [128, 184, 64], [68, 128, 42]],
    bud: [190, 208, 76], budHi: [226, 236, 120],
    salmon: [228, 148, 152],
    cream: [252, 244, 228], throat: [222, 230, 140], spot: [140, 30, 70],
    anther: [150, 66, 34], filament: [214, 220, 150], pistil: [176, 200, 108], stigma: [120, 140, 66],
    white: [250, 247, 240], whitePink: [248, 226, 230], whiteBud: [206, 222, 140],
    brown: [168, 110, 80], brownDark: [112, 68, 48], brownBase: [138, 150, 70],
  };

  // ---------- primitives (collected per frame, depth-sorted, split into layers) ----------
  const POLY = 0, LINE = 1;
  const pool = [];
  let np = 0, seam = 1;
  function prim(type, z, col, w) {
    let p = pool[np];
    if (!p) { p = { type: 0, z: 0, n: 0, pts: new Float32Array(64), col: '', w: 0 }; pool[np] = p; }
    np++;
    p.type = type; p.z = z; p.col = col; p.w = w; p.n = 0;
    return p;
  }
  function pt(p, x, y) { p.pts[p.n * 2] = x; p.pts[p.n * 2 + 1] = y; p.n++; }
  function drawPrim(c, p) {
    const a = p.pts;
    c.beginPath();
    c.moveTo(a[0], a[1]);
    for (let i = 1; i < p.n; i++) c.lineTo(a[i * 2], a[i * 2 + 1]);
    if (p.type === POLY) {
      c.closePath();
      c.fillStyle = p.col; c.fill();
      if (p.w) { c.lineWidth = p.w; c.strokeStyle = p.col; c.stroke(); }
    } else {
      c.lineWidth = p.w; c.strokeStyle = p.col; c.stroke();
    }
  }

  // ---------- bouquet ----------
  let stems = [], flowers = [], petals = [];

  function build(seed) {
    const R = mulberry(seed);
    const rr = (a, b) => a + R() * (b - a);
    const pick = arr => arr[(R() * arr.length) | 0];
    stems = []; flowers = []; petals = [];

    function makeStem(tx, ty, kind, z) {
      const s = {
        bx: rr(-10, 10), tx, ty, kind, z,
        delay: rr(0, 0.8), ph: rr(0, 6.28), width: rr(7, 9),
        off: 0, vel: 0, c: new Float32Array(8), p: 0, leaves: [],
      };
      const n = kind === 'main' ? 13 + ((R() * 6) | 0) : 9 + ((R() * 5) | 0);
      let side = R() < .5 ? 1 : -1;
      for (let k = 0; k < n; k++) {
        const u = 0.26 + (k / n) * 0.64 + rr(-0.02, 0.02);
        side = -side;
        const len = rr(50, 86) * (1.2 - u * 0.5);
        s.leaves.push({
          u, side,
          spread: rr(0.4, 0.95),
          len, w: len * rr(0.26, 0.34),
          bend: side * rr(0.08, 0.38),
          col: pick(C.leaves),
          dz: rr(-24, 24), shade: rr(0.85, 1.1),
        });
      }
      stems.push(s);
      return s;
    }

    function addFlower(stem, type, opt = {}) {
      const f = Object.assign({
        stem, type, u: 1, ped: null, id: flowers.length + 1,
        rot: rr(0, Math.PI * 2), openDelay: rr(0, 3.2), droop: 0,
        ax: rr(-0.18, 0.18), ay: rr(-0.12, 0.08), az: 0.7,
        ph: rr(0, 6.28), x: 0, y: 0, bloom: 0, tj: [],
      }, opt);
      for (let k = 0; k < 6; k++) f.tj.push({ da: rr(-0.13, 0.13), dA: rr(-0.18, 0.18), dl: rr(0.9, 1.06) });
      if (type === 'star') {
        f.R = f.R || rr(110, 128);
        f.W = f.R * rr(0.2, 0.24);
        f.az = rr(0.5, 0.95);
        const v = R();
        f.inner = v < .3 ? [244, 140, 172] : v < .75 ? [238, 104, 146] : [222, 80, 128];
        f.edge = mix([246, 186, 204], [255, 238, 242], rr(0, 0.7));
        f.back = mix([236, 186, 202], [244, 214, 222], rr(0, 1));
      } else if (type === 'white') {
        f.R = f.R || rr(80, 98);
        f.W = f.R * 0.17;
        f.az = rr(0.12, 0.38);
        f.tint = R() < 0.4;
      } else if (type === 'bud') {
        f.R = f.R || rr(56, 80);
        f.W = f.R * 0.26;
        f.az = rr(0, 0.3);
      } else if (type === 'brown') {
        f.R = f.R || rr(98, 114);
        f.W = f.R * 0.24;
        f.az = rr(0, 0.25);
      }
      flowers.push(f);
      return f;
    }

    // main tall stems -> pink oriental lilies + a couple of bud clusters
    const mainTypes = ['star', 'star', 'star', 'star', 'star', 'star', 'star', 'bud', 'bud'];
    const mainN = mainTypes.length;
    for (let i = mainTypes.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [mainTypes[i], mainTypes[j]] = [mainTypes[j], mainTypes[i]]; }
    for (let i = 0; i < mainN; i++) {
      const f = (i / (mainN - 1)) * 2 - 1;
      const ff = f * 0.86 + rr(-0.04, 0.04);
      const tall = mainTypes[i] === 'bud' ? 50 : 0;
      const s = makeStem(ff * 250, -(560 + (1 - ff * ff) * 150 + tall + (i % 2 ? -70 : 30) + rr(-15, 15)), 'main',
        i % 2 ? rr(10, 50) : rr(-40, 10));
      const t = mainTypes[i];
      addFlower(s, t);
      if (t === 'bud') {
        addFlower(s, 'bud', { u: rr(0.8, 0.88), ped: { ang: rr(0.35, 0.7), len: rr(40, 60) } });
        addFlower(s, 'bud', { u: rr(0.88, 0.94), ped: { ang: -rr(0.35, 0.7), len: rr(30, 50) } });
      } else if (R() < 0.6) {
        const sec = R();
        const tp = sec < .45 ? 'bud' : sec < .75 ? 'white' : 'star';
        addFlower(s, tp, {
          u: rr(0.76, 0.86),
          ped: { ang: (R() < .5 ? -1 : 1) * rr(0.45, 0.85), len: rr(48, 78) },
          R: tp === 'star' ? rr(78, 92) : 0,
          droop: tp === 'white' ? Math.sign(s.tx || 1) * rr(0.3, 0.7) : 0,
        });
      }
    }
    // shorter outer + inner stems -> white trumpet lilies
    for (const o of [-1.08, -0.92, -0.74, 0.74, 0.93, 1.1]) {
      const s = makeStem(o * 255 + rr(-12, 12), -rr(420, 540), 'outer', rr(-45, 25));
      addFlower(s, 'white', { droop: Math.sign(o) * rr(0.45, 0.85) });
      if (R() < 0.45) addFlower(s, 'bud', { u: rr(0.8, 0.88), ped: { ang: -Math.sign(o) * rr(0.3, 0.6), len: rr(36, 56) } });
    }
    for (const o of [-0.42, -0.08, 0.36]) {
      const s = makeStem(o * 255 + rr(-15, 15), -rr(440, 520), 'outer', rr(-10, 40));
      addFlower(s, 'white', { droop: Math.sign(o) * rr(0.6, 1.0) });
    }
    // one big closed brown bud on the left, like the original
    const leftStems = stems.filter(s => s.tx < -90);
    const hb = leftStems[(R() * leftStems.length) | 0] || stems[0];
    addFlower(hb, 'brown', { u: rr(0.72, 0.8), ped: { ang: -rr(0.5, 0.8), len: rr(55, 75) } });
  }

  // ---------- timing ----------
  const GROW = 2.8;
  const stemProgress = s => easeOut(clamp((T - s.delay) / GROW));
  const leafProgress = (s, l) => easeOut(clamp((T - s.delay - l.u * GROW * 0.85) / 0.9));
  const pedProgress = f => easeOut(clamp((T - f.stem.delay - f.u * GROW * 0.9) / 0.9));
  const budProgress = f => clamp((T - f.stem.delay - GROW * 0.75 - (f.ped ? 0.35 : 0)) / 1.8);
  const blushProgress = f => clamp((T - f.stem.delay - GROW - 0.6 - f.openDelay) / 2.2);
  const openProgress = f => clamp((T - f.stem.delay - GROW - 2.2 - f.openDelay) / 4.4);

  // ---------- geometry ----------
  const SP = { x: 0, y: 0, a: 0 };
  function bez(c, u, out) {
    const m = 1 - u, a = m * m * m, b = 3 * m * m * u, d = 3 * m * u * u, e = u * u * u;
    out.x = a * c[0] + b * c[2] + d * c[4] + e * c[6];
    out.y = a * c[1] + b * c[3] + d * c[5] + e * c[7];
    const da = 3 * m * m, db = 6 * m * u, dc = 3 * u * u;
    const dx = da * (c[2] - c[0]) + db * (c[4] - c[2]) + dc * (c[6] - c[4]);
    const dy = da * (c[3] - c[1]) + db * (c[5] - c[3]) + dc * (c[7] - c[5]);
    out.a = Math.atan2(dy, dx);
    return out;
  }
  const stemZ = (s, u) => s.z * u * u;

  // ---------- stems & leaves ----------
  function stemColors(s) {
    const base = mix(C.stemYoung, C.stemOld, clamp((T - s.delay) / 6));
    return [rgbc(base, 0.8), rgbc(base, 1.2)];
  }
  function emitStem(s) {
    const p = s.p;
    if (p <= 0) return;
    const [dark, lite] = stemColors(s);
    const N = 24, CH = 4;
    for (let c0 = 0; c0 < N; c0 += CH) {
      const z = stemZ(s, ((c0 + CH / 2) / N) * p);
      const a = prim(LINE, z, dark, s.width);
      const b = prim(LINE, z + 0.01, lite, s.width * 0.36);
      for (let i = c0; i <= Math.min(N, c0 + CH); i++) {
        bez(s.c, (i / N) * p, SP);
        pt(a, SP.x, SP.y);
        const nx = -Math.sin(SP.a), ny = Math.cos(SP.a);
        const sd = (nx * LX + ny * LY) > 0 ? 1 : -1;
        pt(b, SP.x + nx * sd * s.width * 0.22, SP.y + ny * sd * s.width * 0.22);
      }
    }
  }

  const LM = new Float32Array(16), LE1 = new Float32Array(16), LE2 = new Float32Array(16);
  function emitLeaf(s, l) {
    const lp = leafProgress(s, l);
    if (lp <= 0) return;
    bez(s.c, l.u, SP);
    const col = mix(C.leafYoung, l.col, clamp((T - s.delay - l.u * GROW) / 4.5));
    const L = l.len * lp, w = l.w * lp * 0.5;
    const sway = Math.sin(T * 1.3 + l.u * 9 + s.ph) * 0.06;
    const th = SP.a + l.side * l.spread * (0.3 + 0.7 * lp) + sway;
    const bend = l.bend * lp;
    const n = 6;
    let x = SP.x, y = SP.y;
    for (let i = 0; i <= n; i++) {
      const u = i / n, t = th + bend * u;
      const hw = w * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.02)), 0.85);
      const nx = -Math.sin(t), ny = Math.cos(t);
      LM[i * 2] = x; LM[i * 2 + 1] = y;
      LE1[i * 2] = x + nx * hw; LE1[i * 2 + 1] = y + ny * hw;
      LE2[i * 2] = x - nx * hw; LE2[i * 2 + 1] = y - ny * hw;
      x += Math.cos(t) * L / n; y += Math.sin(t) * L / n;
    }
    // folded leaf: the half that faces the light is brighter
    const nx0 = -Math.sin(th + bend * 0.5), ny0 = Math.cos(th + bend * 0.5);
    const lit1 = nx0 * LX + ny0 * LY > 0;
    const z = stemZ(s, l.u) + l.dz;
    const a = prim(POLY, z, rgbc(col, l.shade * (lit1 ? 1.12 : 0.7)), seam);
    const b = prim(POLY, z + 0.01, rgbc(col, l.shade * (lit1 ? 0.7 : 1.12)), seam);
    for (let i = 0; i <= n; i++) { pt(a, LE1[i * 2], LE1[i * 2 + 1]); pt(b, LE2[i * 2], LE2[i * 2 + 1]); }
    for (let i = n; i >= 0; i--) { pt(a, LM[i * 2], LM[i * 2 + 1]); pt(b, LM[i * 2], LM[i * 2 + 1]); }
  }

  // where a flower sits (world x, y, z) and the 2D direction it grows in
  const AN = { x: 0, y: 0, z: 0, a: 0 };
  function anchor(f, out) {
    const s = f.stem;
    if (!f.ped) {
      if (s.p < 0.999) return false;
      bez(s.c, 1, SP);
      out.x = SP.x; out.y = SP.y; out.a = SP.a; out.z = s.z;
      return true;
    }
    if (s.p < f.u) return false;
    const pp = pedProgress(f);
    if (pp <= 0) return false;
    bez(s.c, f.u, SP);
    const a = SP.a + f.ped.ang * (0.4 + 0.6 * pp);
    const len = f.ped.len * pp;
    const ex = SP.x + Math.cos(a) * len, ey = SP.y + Math.sin(a) * len;
    const cx = SP.x + Math.cos(SP.a) * len * 0.5, cy = SP.y + Math.sin(SP.a) * len * 0.5;
    const z = stemZ(s, f.u) + 6;
    const [dark, lite] = stemColors(s);
    const l1 = prim(LINE, z, dark, s.width * 0.75);
    const l2 = prim(LINE, z + 0.01, lite, s.width * 0.28);
    for (let i = 0; i <= 5; i++) {
      const t = i / 5, m = 1 - t;
      const x = m * m * SP.x + 2 * m * t * cx + t * t * ex;
      const y = m * m * SP.y + 2 * m * t * cy + t * t * ey;
      pt(l1, x, y); pt(l2, x - 1.2, y - 1.2);
    }
    out.x = ex; out.y = ey; out.a = a; out.z = z;
    return pp > 0.85;
  }

  // ---------- 3D lily ----------
  // Each tepal is a curved strip: a spine that leaves the flower axis at angle α(s)
  // (closed bud: hugging the axis; open: flaring out and recurving at the tip),
  // with width along the strip and a cupped cross-section. Rendered as lit quads.
  const VX = new Float32Array(81), VY = new Float32Array(81), VZ = new Float32Array(81);
  const OPEN = {
    star: s => 0.56 + 1.5 * Math.pow(s, 1.6),          // 32° at the base -> recurved ~118° at the tip
    white: s => 0.22 + 1.7 * smooth(0.45, 1, s),        // long trumpet, tip rolls back
  };
  const CUP = { star: 0.26, white: 0.36 };
  const budA = s => 0.21 - 0.42 * s;                    // swollen middle, closed pointed tip
  const shapeW = s => Math.max(0.1, Math.pow(Math.sin(Math.PI * Math.pow(s, 0.8)), 0.75));

  function petalColor(f, k, i, j, s, t, ok, blush, front) {
    const m = Math.abs(t);
    if (f.type === 'star') {
      const tc = clamp(blush * 0.45 + ok * 1.1);
      const back = mix(f.back, [196, 214, 140], smooth(0.4, 0, s) * 0.75);
      const budc = tc < 0.5 ? mix(C.bud, C.salmon, tc * 2) : mix(C.salmon, back, (tc - 0.5) * 2);
      if (!front) return budc;
      let c = mix(f.inner, f.edge, smooth(0.35, 1, m));
      c = mix(c, C.cream, smooth(0.32, 0.06, s) * 0.92);
      c = mix(c, C.throat, smooth(0.14, 0, s) * 0.8);
      if (s > 0.12 && s < 0.62 && m < 0.75 && hash(f.id * 7 + k, i, j) < 0.26) c = mix(c, C.spot, 0.55);
      return mix(budc, c, smooth(0.12, 0.7, ok));
    }
    if (f.type === 'white') {
      const back = mix([234, 236, 218], [176, 200, 108], smooth(0.55, 0, s) * 0.8);
      const budc = mix(C.whiteBud, back, clamp(blush * 0.4 + ok));
      if (!front) return budc;
      let c = mix(C.white, f.tint ? C.whitePink : C.white, smooth(0.5, 1, m));
      c = mix(c, [204, 222, 146], smooth(0.42, 0.04, s) * 0.85);
      return mix(budc, c, smooth(0.1, 0.6, ok));
    }
    if (f.type === 'brown') {
      let c = mix(C.brownBase, C.brown, smooth(0.05, 0.45, s));
      if (m < 0.3) c = mix(c, C.brownDark, 0.4);
      return c;
    }
    let c = mix(C.bud, C.budHi, s * 0.7);
    if (m < 0.3) c = mix(c, [150, 176, 60], 0.35);
    return c;
  }

  function emitLily(f, bx, by, bz, Ax, Ay, Az, o, g, blush) {
    // basis U, V perpendicular to the flower axis A
    let ux = Ay, uy = -Ax;
    let ul = Math.hypot(ux, uy);
    if (ul < 1e-3) { ux = 1; uy = 0; ul = 1; }
    ux /= ul; uy /= ul;
    const uz = 0;
    const vx = Ay * uz - Az * uy, vy = Az * ux - Ax * uz, vz = Ax * uy - Ay * ux;
    const opens = f.type === 'star' || f.type === 'white';
    const openA = OPEN[f.type], cupOpen = CUP[f.type] || 0.55;
    // closed buds need fewer facets than open flowers
    const full = opens && o > 0;
    const isWhite = f.type === 'white';
    const NS = full ? (isWhite ? 6 : 7) : 5, NT = full ? (isWhite ? 3 : 4) : 2;
    for (let k = 0; k < 6; k++) {
      const outer = (k & 1) === 0;
      const tj = f.tj[k];
      const ok = opens ? clamp((o - (outer ? 0 : 0.12)) / 0.88) : 0;
      const ang = f.rot + k * Math.PI / 3 + tj.da;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = ux * ca + vx * sa, ry = uy * ca + vy * sa, rz = uz * ca + vz * sa;
      const tx = Ay * rz - Az * ry, ty = Az * rx - Ax * rz, tz = Ax * ry - Ay * rx;
      const eo = easeOut(ok);
      const Lk = g * f.R * lerp(0.62, 1, eo) * tj.dl * (outer ? 1 : 0.95);
      const Wk = g * f.W * lerp(0.42, 1, smooth(0, 0.8, ok)) * (outer ? 0.9 : 1.1);
      const cup = lerp(0.55, cupOpen, ok);
      let px = bx + rx * 2 * g, py = by + ry * 2 * g, pz = bz + rz * 2 * g;
      const ds = Lk / NS;
      for (let i = 0; i <= NS; i++) {
        const s = i / NS;
        // tips part first, the split then runs down towards the base
        const oks = opens ? smooth(0, 1, ok * 1.5 - (1 - s) * 0.5) : 0;
        const al = opens ? lerp(budA(s), openA(s) + tj.dA * s, oks) : budA(s);
        const c = Math.cos(al), sn = Math.sin(al);
        const nx = Ax * sn - rx * c, ny = Ay * sn - ry * c, nz = Az * sn - rz * c;
        const w = Wk * shapeW(s);
        for (let j = 0; j <= NT; j++) {
          const t = -1 + 2 * j / NT;
          const id = i * (NT + 1) + j;
          const cu = cup * t * t * w;
          VX[id] = px + tx * t * w + nx * cu;
          VY[id] = py + ty * t * w + ny * cu;
          VZ[id] = pz + tz * t * w + nz * cu;
        }
        px += (Ax * c + rx * sn) * ds; py += (Ay * c + ry * sn) * ds; pz += (Az * c + rz * sn) * ds;
      }
      let zSum = 0, edgeCol = null;
      for (let i = 0; i < NS; i++) {
        const sm = (i + 0.5) / NS;
        const ao = lerp(0.55, 1, smooth(0, 0.35, sm));
        for (let j = 0; j < NT; j++) {
          const a = i * (NT + 1) + j, b = a + NT + 1, c2 = b + 1, d = a + 1;
          const e1x = VX[b] - VX[a], e1y = VY[b] - VY[a], e1z = VZ[b] - VZ[a];
          const e2x = VX[d] - VX[a], e2y = VY[d] - VY[a], e2z = VZ[d] - VZ[a];
          let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
          const nl = Math.hypot(nx, ny, nz) || 1;
          nx /= nl; ny /= nl; nz /= nl;
          const front = nz > 0;
          if (!front) { nx = -nx; ny = -ny; nz = -nz; }
          const diff = Math.max(0, nx * LX + ny * LY + nz * LZ);
          const shade = (isWhite ? 0.82 + 0.34 * diff : 0.48 + 0.72 * diff) * ao * (front ? 1 : 0.9);
          const col = petalColor(f, k, i, j, sm, -1 + 2 * (j + 0.5) / NT, ok, blush, front);
          const qz = (VZ[a] + VZ[b] + VZ[c2] + VZ[d]) * 0.25;
          const p = prim(POLY, qz, rgbc(col, shade), seam);
          pt(p, VX[a], VY[a]); pt(p, VX[b], VY[b]); pt(p, VX[c2], VY[c2]); pt(p, VX[d], VY[d]);
          zSum += qz;
          if (i === (NS >> 1) && j === 0) edgeCol = rgbc(col, shade * 0.32);
        }
      }
      // dark margins so overlapping tepals stay readable in the character grid
      if (full) {
        const ez = zSum / (NS * NT) + 0.3;
        const e1 = prim(LINE, ez, edgeCol, seam * 1.1), e2 = prim(LINE, ez, edgeCol, seam * 1.1);
        for (let i = 0; i <= NS; i++) {
          const a = i * (NT + 1);
          pt(e1, VX[a], VY[a]); pt(e2, VX[a + NT], VY[a + NT]);
        }
      }
    }

    // stamens and pistil grow out of the open flower
    if (opens && o > 0.35) {
      const sa = smooth(0.35, 0.9, o);
      const isStar = f.type === 'star';
      const len = f.R * (isStar ? 0.6 : 0.82) * sa * g;
      const beta = isStar ? 0.42 : 0.13;
      const cb = Math.cos(beta), sb = Math.sin(beta);
      const p0x = bx + Ax * 3, p0y = by + Ay * 3, p0z = bz + Az * 3;
      const filament = rgbc(C.filament, 0.95), anther = rgbc(C.anther, 1);
      for (let m = 0; m < 6; m++) {
        const ang = f.rot + m * Math.PI / 3 + Math.PI / 6;
        const ca = Math.cos(ang), san = Math.sin(ang);
        const rx = ux * ca + vx * san, ry = uy * ca + vy * san, rz = uz * ca + vz * san;
        const dx = Ax * cb + rx * sb, dy = Ay * cb + ry * sb, dz = Az * cb + rz * sb;
        const l = len * (0.92 + 0.08 * Math.sin(m * 2.1 + f.id));
        const mx = p0x + dx * l * 0.5 + Ax * l * 0.06, my = p0y + dy * l * 0.5 + Ay * l * 0.06;
        const ex = p0x + dx * l, ey = p0y + dy * l, ez = p0z + dz * l;
        const fl = prim(LINE, (p0z + ez) * 0.5, filament, 1.5);
        pt(fl, p0x, p0y); pt(fl, mx, my); pt(fl, ex, ey);
        let qx = dx, qy = dy;
        const ql = Math.hypot(qx, qy) || 1; qx /= ql; qy /= ql;
        const an = prim(POLY, ez + 0.5, anther, 0);
        pt(an, ex + qx * 2, ey + qy * 2); pt(an, ex - qy * 5, ey + qx * 5);
        pt(an, ex - qx * 2, ey - qy * 2); pt(an, ex + qy * 5, ey - qx * 5);
      }
      const pl = len * 1.08;
      const sx = p0x + Ax * pl, sy = p0y + Ay * pl, sz = p0z + Az * pl;
      const pi = prim(LINE, (p0z + sz) * 0.5, rgbc(C.pistil, 1), 2.2);
      pt(pi, p0x, p0y); pt(pi, sx, sy);
      const st = prim(POLY, sz + 0.6, rgbc(C.stigma, 1), 0);
      pt(st, sx - 3.5, sy); pt(st, sx, sy - 3.5); pt(st, sx + 3.5, sy); pt(st, sx, sy + 3.5);
    }
  }

  function emitFlower(f) {
    if (!anchor(f, AN)) return;
    const bp = budProgress(f);
    if (bp <= 0) return;
    const g = easeOut(bp);
    const o = (f.type === 'star' || f.type === 'white') ? openProgress(f) : 0;
    const blush = blushProgress(f);
    f.bloom = o;
    // flower axis: buds follow the stem, open flowers turn towards the viewer
    const tx = Math.cos(AN.a), ty = Math.sin(AN.a);
    let ox, oy, oz;
    if (f.type === 'star') { ox = tx * 0.55 + f.ax; oy = ty * 0.55 + f.ay; oz = f.az; }
    else if (f.type === 'white') { const d = AN.a + f.droop; ox = Math.cos(d); oy = Math.sin(d); oz = f.az; }
    else { ox = tx; oy = ty; oz = f.az; }
    const e = smooth(0, 0.7, o);
    let Ax = lerp(tx, ox, e) + Math.sin(T * 0.8 + f.ph) * 0.04;
    let Ay = lerp(ty, oy, e) + Math.cos(T * 0.7 + f.ph) * 0.03;
    let Az = lerp(0.22, oz, e);
    const al = Math.hypot(Ax, Ay, Az) || 1;
    Ax /= al; Ay /= al; Az /= al;
    f.x = AN.x + Ax * f.R * 0.3; f.y = AN.y + Ay * f.R * 0.3;
    emitLily(f, AN.x, AN.y, AN.z, Ax, Ay, Az, o, g, blush);
  }

  function emitPetal(p) {
    const k = 0.6 + 0.5 * Math.abs(Math.cos(p.flip));
    const q = prim(POLY, 100, rgbc(p.col, k * p.alpha), 0);
    const c = Math.cos(p.r), s = Math.sin(p.r), fl = Math.cos(p.flip);
    const L = p.L, w = L * 0.3 * fl;
    const shape = [[0, 0], [L * 0.3, -w], [L * 0.7, -w * 0.8], [L, 0], [L * 0.7, w * 0.8], [L * 0.3, w]];
    for (const [x, y] of shape) pt(q, p.x + x * c - y * s, p.y + x * s + y * c);
  }

  // ---------- simulation ----------
  let T = 0, started = false, seed = 20261003;
  const mouse = { x: -1e4, y: -1e4, vx: 0, active: 0, lastT: 0 };

  function update(dt) {
    mouse.vx *= Math.exp(-dt * 5);
    mouse.active = Math.max(0, mouse.active - dt);
    const mwx = (mouse.x - OX) / S, mwy = (mouse.y - OY) / S;
    const mvx = clamp(mouse.vx / S, -700, 700);
    for (const s of stems) {
      const dx = s.tx + s.off - mwx, dy = s.ty * 0.8 - mwy;
      const g = Math.exp(-(dx * dx + dy * dy) / (2 * 230 * 230));
      const acc = -16 * s.off - 3.2 * s.vel + mvx * g * 2.4;
      s.vel += acc * dt;
      s.off = clamp(s.off + s.vel * dt, -110, 110);
      s.p = stemProgress(s);
      const swayAmp = reduce ? 0 : 1;
      const o = (Math.sin(T * 0.75 + s.ph) * 6 + Math.sin(T * 1.7 + s.ph * 2.3) * 1.8) * swayAmp * s.p + s.off;
      const c = s.c;
      c[0] = s.bx; c[1] = 0;
      c[2] = s.bx * 1.3; c[3] = -230;
      c[4] = s.tx * 0.6 + o * 0.45; c[5] = s.ty * 0.62;
      c[6] = s.tx + o; c[7] = s.ty + Math.abs(o) * 0.12;
    }
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.vy = Math.min(p.vy + 70 * dt, 85);
      p.vx += (Math.sin(T * 1.6 + p.ph) * 40 - p.vx * 0.9) * dt + mvx * 0.004;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.r += p.vr * dt; p.flip += p.vf * dt;
      if (p.y > -20) p.alpha -= dt * 0.9;
      if (p.alpha <= 0 || p.y > 120) petals.splice(i, 1);
    }
  }

  function gust(sx, sy) {
    const wx = (sx - OX) / S, wy = (sy - OY) / S;
    for (const s of stems) {
      const dx = s.tx + s.off - wx, dy = s.ty * 0.8 - wy;
      const d = Math.hypot(dx, dy);
      const g = Math.exp(-(d * d) / (2 * 320 * 320));
      s.vel += Math.sign(dx || 1) * (60 + 260 * g) * (0.8 + Math.random() * 0.4);
    }
    // shake a few petals loose from the nearest open flowers
    const open = flowers.filter(f => (f.type === 'star' || f.type === 'white') && f.bloom > 0.85)
      .map(f => ({ f, d: Math.hypot(f.x - wx, f.y - wy) }))
      .sort((a, b) => a.d - b.d).slice(0, 2);
    for (const { f, d } of open) {
      if (d > 420) continue;
      const n = 3 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n && petals.length < 140; i++) {
        const away = Math.sign(f.x - wx || 1);
        petals.push({
          x: f.x + (Math.random() - .5) * f.R * 0.8, y: f.y + (Math.random() - .5) * f.R * 0.6,
          vx: away * (40 + Math.random() * 90), vy: -30 - Math.random() * 40,
          r: Math.random() * 6.28, vr: (Math.random() - .5) * 5,
          flip: Math.random() * 6.28, vf: 1.5 + Math.random() * 3,
          L: f.type === 'star' ? 22 + Math.random() * 10 : 16 + Math.random() * 8,
          col: f.type === 'star' ? (Math.random() < .5 ? f.inner : f.edge) : C.white,
          alpha: 1, ph: Math.random() * 6.28,
        });
      }
    }
  }

  // ---------- render ----------
  function asciiLayer(L, li) {
    const img = L.x.getImageData(0, 0, cols, rows).data;
    const td = tintImg.data;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.globalCompositeOperation = 'source-over';
    mctx.clearRect(0, 0, mask.width, mask.height);
    const cwD = cellW * dpr, chD = cellH * dpr;
    const oxD = L.ox * cellW * dpr, oyD = L.oy * cellH * dpr;
    const sw = gw * L.sc, sh = gh * L.sc, adjX = (L.sc - 1) * 0.5 * gw, adjY = (L.sc - 1) * 0.5 * gh;
    const mcx = (mouse.x - L.ox * cellW) / cellW, mcy = (mouse.y - L.oy * cellH) / cellH;
    const mr = (coarse ? 70 : 58) / cellW, mrY = mr * cellW / cellH;
    const scrambleOn = mouse.active > 0;
    const epochRate = reduce ? 0 : 0.55;
    let any = 0;
    for (let y = 0; y < rows; y++) {
      const row = y * cols;
      for (let x = 0; x < cols; x++) {
        const i = (row + x) << 2;
        const a = img[i + 3];
        if (a < 26) { td[i + 3] = 0; continue; }
        any++;
        const k = a / 255;
        const r0 = img[i], g0 = img[i + 1], b0 = img[i + 2];
        const lum = Math.max(r0, g0, b0) / 255;
        const h = hash(x, y, li * 7 + 3);
        const h2 = hash(x, y, Math.floor(T * epochRate + h * 13) * 3 + li);
        // brighter, more solid cells get denser glyphs
        let idx = Math.round(k * (0.3 + 0.7 * lum) * (RL - 1) + (h2 - 0.5) * 2.6);
        if (k < 0.45 && idx > 3) idx = 3;
        idx = idx < 0 ? 0 : idx >= RL ? RL - 1 : idx;
        let br = L.br * (0.62 + 0.38 * k) * (0.9 + 0.2 * h) * 1.22;
        if (scrambleOn) {
          const dx = (x - mcx) / mr, dy = (y - mcy) / mrY;
          const d2 = dx * dx + dy * dy;
          if (d2 < 1) {
            if (Math.random() < 0.55 * (1 - d2)) idx = RL + ((Math.random() * SCR.length) | 0);
            br *= 1 + 0.4 * (1 - d2) * Math.min(1, mouse.active);
          }
        }
        td[i] = Math.min(255, r0 * br);
        td[i + 1] = Math.min(255, g0 * br);
        td[i + 2] = Math.min(255, b0 * br);
        td[i + 3] = 255;
        mctx.drawImage(atlas, idx * gw, 0, gw, gh, Math.round(x * cwD + oxD - adjX), Math.round(y * chD + oyD - adjY), sw, sh);
      }
    }
    if (!any) return;
    // colour every stamped glyph with its cell colour
    tctx.putImageData(tintImg, 0, 0);
    mctx.globalCompositeOperation = 'source-in';
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(tint, oxD, oyD, cols * cwD, rows * chD);
    mctx.globalCompositeOperation = 'source-over';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if (L.shadow) {
      // this layer casts a soft shadow on everything behind it
      sctx.globalCompositeOperation = 'source-over';
      sctx.clearRect(0, 0, cols, rows);
      sctx.drawImage(L.c, 0, 0);
      sctx.globalCompositeOperation = 'source-in';
      sctx.fillStyle = '#000';
      sctx.fillRect(0, 0, cols, rows);
      sctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = L.shadow;
      ctx.drawImage(sil, oxD + cwD * 0.35, oyD + chD * 0.45, cols * cwD, rows * chD);
    }
    ctx.globalAlpha = 0.42 * L.br;
    ctx.drawImage(L.c, oxD, oyD, cols * cwD, rows * chD);
    ctx.globalAlpha = 1;
    ctx.drawImage(mask, 0, 0);
  }

  let order = [];
  function render() {
    np = 0;
    seam = 0.55 * cellW / S;
    for (const s of stems) emitStem(s);
    for (const s of stems) for (const l of s.leaves) emitLeaf(s, l);
    for (const f of flowers) emitFlower(f);
    for (const p of petals) emitPetal(p);

    order.length = np;
    for (let i = 0; i < np; i++) order[i] = pool[i];
    order.sort((a, b) => a.z - b.z);

    for (const L of LAYERS) {
      L.x.setTransform(1, 0, 0, 1, 0, 0);
      L.x.clearRect(0, 0, cols, rows);
      L.x.setTransform(S / cellW, 0, 0, S / cellH, (OX - L.ox * cellW) / cellW, (OY - L.oy * cellH) / cellH);
      L.x.lineCap = 'round'; L.x.lineJoin = 'round';
    }
    for (let i = 0; i < np; i++) {
      const p = order[i];
      drawPrim((p.z < Z1 ? LAYERS[0] : p.z < Z2 ? LAYERS[1] : LAYERS[2]).x, p);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let li = 0; li < LAYERS.length; li++) asciiLayer(LAYERS[li], li);
  }

  // ---------- loop ----------
  let last = performance.now(), cost = 0, tick = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (started) {
      T += dt; update(dt);
      // on slow devices redraw the grid only every 2nd or 3rd frame; time itself keeps running
      const every = cost > 34 ? 3 : cost > 14 ? 2 : 1;
      if (++tick >= every) {
        tick = 0;
        const t0 = performance.now(); render(); cost = lerp(cost, performance.now() - t0, 0.15);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- gate / interaction ----------
  const intro = document.getElementById('intro');
  const hint = document.getElementById('hint');
  const gate = document.getElementById('gate');
  const input = document.getElementById('d');
  let hintTimer = 0;
  function showHint() {
    clearTimeout(hintTimer);
    hint.classList.remove('rest');
    hint.classList.add('on');
    hintTimer = setTimeout(() => hint.classList.add('rest'), 7000);
  }

  function normDate(v) {
    const parts = v.trim().split(/[^0-9]+/).filter(Boolean);
    let d, m, y;
    if (parts.length === 3) {
      [d, m, y] = parts;
      if (d.length === 4) [y, m, d] = parts;
    } else if (parts.length === 1) {
      const s = parts[0];
      if (s.length === 8) { d = s.slice(0, 2); m = s.slice(2, 4); y = s.slice(4); }
      else if (s.length === 7) { d = s.slice(0, 1); m = s.slice(1, 3); y = s.slice(3); }
      else if (s.length === 6) { d = s.slice(0, 2); m = s.slice(2, 4); y = s.slice(4); }
      else return '';
    } else return '';
    d = +d; m = +m; y = +y;
    if (y < 100) y += 2000;
    return `${y}-${m}-${d}`;
  }
  function fnv(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  const KEY = 2207576843;
  const ok = () => fnv(normDate(input.value)) === KEY;

  function start() {
    if (started) return;
    input.blur();
    build(seed);
    T = reduce ? 20 : 0;
    started = true;
    intro.classList.add('gone');
    setTimeout(() => { intro.hidden = true; }, 1200);
    setTimeout(showHint, reduce ? 300 : 13000);
  }
  function regrow() {
    seed = (Math.random() * 1e9) | 0;
    build(seed);
    T = reduce ? 20 : 0;
    showHint();
  }

  // the right date opens it; anything else simply does nothing
  // dots appear by themselves after two digits; a typed . or , only counts after a single digit (3.1.2026)
  function formatDate(raw) {
    const seg = ['', '', ''];
    let idx = 0;
    for (const ch of raw) {
      if (ch >= '0' && ch <= '9') {
        if (idx < 2 && seg[idx].length === 2) idx++;
        if (idx === 2 && seg[2].length >= 4) continue;
        seg[idx] += ch;
        if (idx < 2 && seg[idx].length === 2) idx++;
      } else if (/[.,\/\- ]/.test(ch) && idx < 2 && seg[idx].length === 1) {
        idx++;
      }
    }
    return seg[0] + (idx > 0 ? '.' : '') + seg[1] + (idx > 1 ? '.' : '') + seg[2];
  }
  input.addEventListener('input', (e) => {
    let v = formatDate(input.value);
    // when deleting, don't put the dot straight back
    if (e.inputType && e.inputType.startsWith('delete') && v.endsWith('.') && !input.value.endsWith('.')) v = v.slice(0, -1);
    if (v !== input.value) {
      input.value = v;
      try { input.setSelectionRange(v.length, v.length); } catch (_) {}
    }
    if (ok()) start();
  });
  gate.addEventListener('submit', (e) => { e.preventDefault(); if (ok()) start(); });
  document.getElementById('regrow').addEventListener('click', (e) => { e.stopPropagation(); regrow(); });
  window.addEventListener('keydown', (e) => {
    if (started && (e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) regrow();
  });

  window.addEventListener('pointermove', (e) => {
    if (!started) return;
    const now = performance.now();
    const dtm = Math.max(8, now - mouse.lastT) / 1000;
    if (mouse.x > -1e3) mouse.vx = lerp(mouse.vx, (e.clientX - mouse.x) / dtm, 0.35);
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.lastT = now;
    mouse.active = 1.2;
  }, { passive: true });
  window.addEventListener('pointerleave', () => { mouse.x = -1e4; mouse.y = -1e4; });
  cv.addEventListener('pointerdown', (e) => {
    if (!started) return;
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = 1.2;
    gust(e.clientX, e.clientY);
  });

  try { input.focus({ preventScroll: true }); } catch (_) {}
})();
</script>
</body>
</html>
